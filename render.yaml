databases:
  - name: ai-laboratorium-postgres
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: ai-laboratorium
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-laboratorium-postgres
          property: connectionString
      - key: PROVIDER_FREE_ONLY
        value: "true"
      - key: REPORT_SIGNING_SECRET
        generateValue: true
      - key: AI_LAB_ACCESS_TOKEN
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: NVIDIA_CONFIRMED_FREE_MODELS
        sync: false

  - type: worker
    name: ai-laboratorium-evolution
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-laboratorium-postgres
          property: connectionString
      - key: PROVIDER_FREE_ONLY
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: NVIDIA_CONFIRMED_FREE_MODELS
        sync: false
      - key: WORKER_CONCURRENCY
        value: "2"
